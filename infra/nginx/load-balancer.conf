upstream satyam_backend_pool {
    least_conn;
    server backend-1:5000 max_fails=3 fail_timeout=30s;
    server backend-2:5000 max_fails=3 fail_timeout=30s;
}

server {
    listen 80;
    server_name api.satyamholidays.com;

    location /healthz {
        proxy_pass http://satyam_backend_pool/api/v1/health;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://satyam_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
