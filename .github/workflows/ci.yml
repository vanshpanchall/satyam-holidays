name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            satyam-holidays-backend/package-lock.json
            satyam-holidays-react/package-lock.json

      - name: Install root deps
        run: npm ci

      - name: Validate Vercel configs
        run: |
          node -e "JSON.parse(require('node:fs').readFileSync('satyam-holidays-backend/vercel.json','utf8'))"
          node -e "JSON.parse(require('node:fs').readFileSync('satyam-holidays-react/vercel.json','utf8'))"

      - name: Lint
        run: npm run lint

      - name: Install backend deps
        run: npm ci
        working-directory: satyam-holidays-backend

      - name: Install frontend deps
        run: npm ci
        working-directory: satyam-holidays-react

      - name: Backend tests
        env:
          NODE_ENV: test
        run: npm test --silent -- --runInBand
        working-directory: satyam-holidays-backend

      - name: Frontend build
        env:
          DISABLE_ESLINT_PLUGIN: true
        run: npm run build --silent
        working-directory: satyam-holidays-react
